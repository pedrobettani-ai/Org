<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Organograma PhizChat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style id="app-style">
/* Layout: full-screen pan/zoom canvas under a slim control bar; editor drawer on the right. Dark-first, echoing the PhizChat deck. */
:root{
  color-scheme:dark;
  --bg:#0f1311;--surface:#171d1a;--surface-2:#1c231f;--band:#131815;--band-edge:#222b26;
  --line:#2b3530;--line-strong:#3d4b43;--fg:#e6eee8;--muted:#8d9b93;--faint:#5f6c65;
  --accent:#5fd38f;--br:#4cc47e;--cn:#f2625a;--new:#e9b949;--new-bg:#221d10;--open-bg:#141916;--link:#86b8ff;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px -12px rgba(0,0,0,.6);
  --f-display:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#eef1ed;--surface:#ffffff;--surface-2:#f6f8f5;--band:#e5eae4;--band-edge:#d5ddd6;
  --line:#cfd8d1;--line-strong:#9fb0a5;--fg:#13201a;--muted:#55645b;--faint:#8b988f;
  --accent:#1c8a4b;--br:#1c8a4b;--cn:#cf3329;--new:#a8740a;--new-bg:#fbf2dc;--open-bg:#edf1ed;--link:#2a62c4;
  --shadow:0 1px 2px rgba(20,32,26,.06),0 10px 24px -16px rgba(20,32,26,.25);
}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#eef1ed;--surface:#ffffff;--surface-2:#f6f8f5;--band:#e5eae4;--band-edge:#d5ddd6;
  --line:#cfd8d1;--line-strong:#9fb0a5;--fg:#13201a;--muted:#55645b;--faint:#8b988f;
  --accent:#1c8a4b;--br:#1c8a4b;--cn:#cf3329;--new:#a8740a;--new-bg:#fbf2dc;--open-bg:#edf1ed;--link:#2a62c4;
  --shadow:0 1px 2px rgba(20,32,26,.06),0 10px 24px -16px rgba(20,32,26,.25);
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-display);font-size:14px;overflow:hidden}
#root,.app{height:100%}
.app{display:flex;flex-direction:column;position:relative}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px;padding-inline:16px;border-bottom:1px solid var(--line);background:var(--bg);position:relative;z-index:5}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:6px}
.brand-k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.brand h1{margin:2px 0 0;font-size:20px;font-weight:750;font-stretch:85%;letter-spacing:-.01em}
.ctrls,.acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.acts{margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 10px;border-radius:6px;font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-strong)}
.tog{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
.tog input{accent-color:var(--accent)}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.ghost{border-color:var(--line);font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:default}
.pill{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:3px 8px;border:1px solid var(--line);border-radius:99px;white-space:nowrap}
.pill.dirty{color:var(--new);border-color:var(--new)}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:6px;min-width:250px;box-shadow:var(--shadow);display:flex;flex-direction:column;z-index:20}
.menu-pop button{text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;font-size:13px}
.menu-pop button:hover{background:var(--surface-2)}
.menu-pop small{display:block;color:var(--muted);font-size:11.5px}

/* stage */
.stage{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;background:
  radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 1.2px) 0 0/22px 22px,var(--bg)}
.stage.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.world.ease{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.lines{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.lines path{fill:none;stroke:var(--line-strong);stroke-width:1.5;transition:d .55s cubic-bezier(.2,.8,.2,1),opacity .3s,stroke .2s}
.lines path.dotted{stroke:var(--link);stroke-dasharray:2 5;stroke-linecap:round;stroke-width:1.6;opacity:.75}
.lines path.chain{stroke:var(--accent);stroke-width:2.2}
.lines path.dim{opacity:.15}
.lines path.leaving{opacity:0}

.band{position:absolute;border:1px solid var(--band-edge);background:var(--band);border-radius:18px;transition:left .55s cubic-bezier(.2,.8,.2,1),top .55s cubic-bezier(.2,.8,.2,1),width .55s cubic-bezier(.2,.8,.2,1),height .55s cubic-bezier(.2,.8,.2,1),opacity .35s}
.band .bl{position:absolute;left:18px;top:14px;display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.band .bl b{color:var(--fg);font-weight:600}
.band.tone-br .bl b{color:var(--br)}.band.tone-cn .bl b{color:var(--cn)}
.band.side .bl{flex-direction:column;align-items:flex-start;gap:6px;white-space:normal;width:110px;letter-spacing:.1em;line-height:1.35}
.hdr{position:absolute;display:flex;flex-direction:column;justify-content:flex-end;padding-left:4px;transition:left .55s,top .55s,width .55s,opacity .35s}
.hdr .ht{font-weight:750;font-stretch:85%;font-size:17px;letter-spacing:-.01em}
.hdr .hs{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.03em;margin-top:2px}
.hdr.mini{justify-content:center}
.hdr.mini .ht{font-family:var(--f-mono);font-weight:500;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.leaving{opacity:0!important}

/* cards */
.card{position:absolute;box-sizing:border-box;padding:11px 13px;border-radius:11px;background:var(--surface);border:1px solid var(--line-strong);box-shadow:var(--shadow);cursor:pointer;user-select:none;
  transition:left .55s cubic-bezier(.2,.8,.2,1),top .55s cubic-bezier(.2,.8,.2,1),width .55s cubic-bezier(.2,.8,.2,1),height .55s cubic-bezier(.2,.8,.2,1),opacity .3s,border-color .2s,box-shadow .2s;
  display:flex;flex-direction:column;gap:3px;overflow:hidden}
.card.enter{animation:cardIn .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.96)}}
.card:hover{border-color:var(--accent)}
.card.lead{border-color:var(--accent);border-width:1.5px}
.card.st-open{background:var(--open-bg);border-color:var(--line)}
.card.st-new{background:var(--new-bg);border:1.5px dashed var(--new)}
.card.k-bu{background:var(--surface-2)}
.card.dim{opacity:.18}
.card.chain{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.card.sel{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.card.dragging{transition:none;z-index:30;opacity:.92;box-shadow:0 18px 40px -12px rgba(0,0,0,.55),0 0 0 2px var(--accent);cursor:grabbing}
.card.drop{box-shadow:0 0 0 3px var(--accent),var(--shadow);border-color:var(--accent)}
.c-top{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);min-height:12px}
.c-top .loc-br{color:var(--br)}.c-top .loc-cn{color:var(--cn)}
.flag{display:inline-block;width:15px;height:10.5px;flex:none;border-radius:1.5px;overflow:hidden}
.flag svg{display:block;width:100%;height:100%}
.stamps{margin-left:auto;display:inline-flex;gap:4px;padding-left:4px}
.stamps~.chip{margin-left:6px}
.stamp{font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.06em;line-height:1;color:var(--link);border:1.5px solid var(--link);border-radius:4px;padding:2px 5px;background:color-mix(in srgb,var(--link) 9%,transparent);transform:rotate(-6deg);opacity:.8;cursor:help;transition:transform .15s,opacity .15s}
.stamp:nth-child(even){transform:rotate(5deg)}
.stamp:hover,.stamp:focus-visible{opacity:1;transform:rotate(0) scale(1.15)}
.stamp.demo{cursor:default;display:inline-block}
.chips .stamp.demo{transform:none;opacity:1}
.fpop{position:absolute;z-index:25;width:262px;background:var(--surface);border:1px solid var(--link);border-radius:14px;padding:10px 12px 10px;box-shadow:0 18px 40px -16px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.fpop.in{animation:popIn .22s cubic-bezier(.2,.8,.2,1)}
@keyframes popIn{from{opacity:0;transform:translateY(-4px) scale(.97)}}
.fpop .fp-k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--link)}
.fpop .fp-h{font-size:11px;color:var(--faint)}
.fpop .card{position:relative;width:auto;min-height:96px;box-shadow:none;cursor:default}
.card.pulse{animation:pulse 1.4s ease-out}
@keyframes pulse{0%,60%{box-shadow:0 0 0 3px var(--link),var(--shadow)}100%{box-shadow:var(--shadow)}}
.chip{margin-left:auto;padding:1px 6px;border-radius:99px;font-size:8.5px;letter-spacing:.1em;border:1px solid var(--line-strong);color:var(--muted)}
.st-new .chip{border-color:var(--new);color:var(--new)}
.c-name{font-weight:700;font-size:14.5px;line-height:1.2;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-name.tbh{font-weight:600;font-style:italic;color:var(--muted)}
.k-bu .c-name{font-family:var(--f-mono);font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.c-role{font-size:12px;line-height:1.3;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.compact .c-role{-webkit-line-clamp:1}
.full .c-scope{padding-right:58px}
.full:not(.folded) .c-scope{padding-right:0}
.full.has-kids:not(.folded) .c-scope{padding-right:24px}
.c-scope{font-size:11.5px;line-height:1.35;color:var(--fg);opacity:.78;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:auto;padding-top:5px;border-top:1px solid var(--line)}
.c-mgr{font-family:var(--f-mono);font-size:10px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:auto}
.c-count{position:absolute;right:13px;top:30px;font-weight:800;font-stretch:80%;font-size:30px;line-height:1;color:var(--fg);font-variant-numeric:tabular-nums}
.has-count .c-name,.has-count .c-role{padding-right:44px}
.cbtns{position:absolute;right:6px;bottom:6px;display:flex;gap:4px}
.card-btn{border:1px solid var(--line-strong);background:var(--surface-2);border-radius:6px;font-family:var(--f-mono);font-size:11px;line-height:1;padding:3px 6px;color:var(--muted);opacity:0;transition:opacity .15s}
.card:hover .card-btn,.card.sel .card-btn,.card-btn.fold.closed{opacity:1}
.card-btn:hover{color:var(--fg);border-color:var(--accent)}
.card-btn.fold{opacity:1}
.card-btn.fold.closed{color:var(--bg);background:var(--accent);border-color:var(--accent);font-weight:600}
.card.folded{box-shadow:5px 5px 0 -1px var(--surface),5px 5px 0 0 var(--line-strong),10px 10px 0 -1px var(--surface),10px 10px 0 0 var(--line)}
.card.folded.sel{box-shadow:0 0 0 2px var(--accent),5px 5px 0 -1px var(--surface),5px 5px 0 0 var(--line-strong)}
@media (hover:none){.card-btn{opacity:1}}

/* floating */
.zoom{position:absolute;right:16px;bottom:16px;display:flex;border:1px solid var(--line);border-radius:9px;background:var(--surface);overflow:hidden;z-index:4}
.zoom button{border:0;background:none;padding:7px 11px;font-size:13px;color:var(--muted)}
.zoom button+button{border-left:1px solid var(--line)}
.zoom button:hover{color:var(--fg)}
.legend{position:absolute;left:16px;bottom:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:auto auto;gap:6px 18px;font-size:11.5px;color:var(--muted);z-index:4;max-width:calc(100% - 32px)}
.legend .lg{display:flex;align-items:center;gap:7px;white-space:nowrap}
.legend .sw{width:22px;height:13px;border-radius:4px;border:1px solid var(--line-strong);background:var(--surface);flex:none}
.legend .sw.open{background:var(--open-bg);border-color:var(--line)}
.legend .sw.new{background:var(--new-bg);border:1.5px dashed var(--new)}
.legend .ln{width:22px;height:0;border-top:1.5px solid var(--line-strong);flex:none}
.legend .ln.dot{border-top:2px dotted var(--link)}
.legend-t{grid-column:1/-1;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);display:flex;justify-content:space-between;align-items:center}
.legend-t button{border:0;background:none;color:var(--faint);font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;padding:0}
.legend.min .lg{display:none}
.hint{position:absolute;left:50%;transform:translateX(-50%);top:12px;font-family:var(--f-mono);font-size:10.5px;color:var(--faint);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 12px;white-space:nowrap;z-index:3;pointer-events:none}
@media (max-width:760px){.hint{display:none}.legend{bottom:62px}}

/* panel */
.panel{position:absolute;right:0;top:0;bottom:0;width:min(380px,100%);background:var(--surface);border-left:1px solid var(--line-strong);z-index:10;display:flex;flex-direction:column;box-shadow:-20px 0 40px -24px rgba(0,0,0,.5);animation:slideIn .3s cubic-bezier(.2,.8,.2,1)}
@keyframes slideIn{from{transform:translateX(24px);opacity:0}}
.p-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.p-head .k{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.p-head h2{margin:2px 0 0;font-size:17px;font-weight:750;font-stretch:88%}
.p-x{border:0;background:none;font-size:20px;color:var(--muted);padding:4px 8px}
.p-body{flex:1;overflow:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>label,.fld>.lbl{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fld input[type=text],.fld input[type=number],.fld select{background:var(--bg);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font:inherit;font-size:13.5px;color:var(--fg);width:100%;box-sizing:border-box}
.fld .help{font-size:11.5px;color:var(--faint)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line-strong);background:var(--bg);border-radius:99px;padding:5px 10px;font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chips button[aria-pressed="true"]{border-color:var(--accent);color:var(--fg);background:var(--surface-2)}
.p-foot{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.p-foot .danger{margin-left:auto;color:var(--cn);border-color:var(--line)}
.confirm{background:var(--bg);border:1px solid var(--cn);border-radius:10px;padding:10px 12px;font-size:12.5px;display:flex;flex-direction:column;gap:8px}
.confirm div{display:flex;gap:8px}
.toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;z-index:30;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (max-width:640px){.bar{gap:8px}.acts{margin-left:0}.panel{top:auto;height:72%;width:100%;border-left:0;border-top:1px solid var(--line-strong);border-radius:16px 16px 0 0}}
.lock,.modal-bg{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:var(--bg);transition:opacity .35s}
.modal-bg{background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(4px)}
.lock.open{opacity:0;pointer-events:none}
.lock-card,.modal{width:min(400px,100%);box-sizing:border-box;background:var(--surface);border:1px solid var(--line-strong);border-radius:16px;padding:26px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);color:var(--fg)}
.lock-card .k,.modal .k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.lock-card h1,.modal h2{margin:0;font-size:24px;font-weight:750;font-stretch:85%}
.modal h2{font-size:19px}
.lock-card p,.modal p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.lock-card input,.modal input[type=password],.modal input[type=text]{background:var(--bg);border:1px solid var(--line-strong);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;color:var(--fg);width:100%;box-sizing:border-box}
.lock-card .btn{padding:10px 14px;font-size:14px}
.err{color:var(--cn);font-size:12.5px;min-height:1em}
.modal .row{display:flex;gap:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head><body>
<template id="app-markup"><div class="app">
<header class="bar">
  <div class="brand"><div class="brand-k">PhizChat · BUs Brasil e China</div><h1>Organograma</h1></div>
  <div class="ctrls">
    <div class="seg" role="group" aria-label="Visão"><button type="button" data-view="tree">Hierarquia</button><button type="button" data-view="tracks">Trilhas por BU</button></div>
    <div class="seg" role="group" aria-label="Local"><button type="button" data-filter="all">Ambos</button><button type="button" data-filter="BR" data-flag="BR">Brasil</button><button type="button" data-filter="CN" data-flag="CN">China</button></div>
    <div class="seg" role="group" aria-label="Recolher"><button type="button" id="btnFold">Recolher tudo</button><button type="button" id="btnUnfold">Expandir tudo</button></div>
    <label class="tog"><input type="checkbox" id="optScope"> Escopo</label>
    <label class="tog"><input type="checkbox" id="optLinks"> Relações funcionais</label>
  </div>
  <div class="acts">
    <button type="button" id="btnAdd" class="btn">+ Nova caixinha</button>
    <button type="button" id="btnUndo" class="btn ghost" title="Desfazer (Ctrl+Z)">Desfazer</button>
    <div class="menu"><button type="button" id="btnExport" class="btn ghost" aria-haspopup="true">Exportar ▾</button>
      <div class="menu-pop" id="exportMenu" hidden>
        <button type="button" data-exp="png">Imagem PNG<small>Alta resolução, visão atual</small></button>
        <button type="button" data-exp="pptx">PowerPoint .pptx<small>Formas editáveis, um slide por área</small></button>
        <button type="button" data-exp="secure">Versão protegida para o GitHub<small>index.html cifrado com sua frase-chave</small></button>
      </div></div>
    <span id="saveState" class="pill"></span>
    <button type="button" id="btnSave" class="btn primary">Salvar</button>
  </div>
</header>
<main id="stage" class="stage">
  <div id="world" class="world"><div id="bandsLayer"></div><svg id="lines" class="lines" xmlns="http://www.w3.org/2000/svg"></svg><div id="cardsLayer"></div></div>
  <div class="hint" id="hint"></div>
  <div class="zoom"><button type="button" id="zOut" aria-label="Diminuir zoom">−</button><button type="button" id="zFit">Ajustar</button><button type="button" id="zIn" aria-label="Aumentar zoom">+</button></div>

  var chip=n.status==='open'?'Vaga aprovada':n.status==='new'?'Nova vaga':(n.kind==='bu'?'Grupo':'');
  var m={flags:flags,loc:loc,locTone:c==='CN'?'cn':c==='BR'?'br':'',chip:chip,name:n.kind==='person'?dispName(n):(n.name||'Grupo'),tbh:n.kind==='person'&&isTBH(n),role:n.role||'',count:n.kind==='team'?(n.count==null||n.count===''?'—':String(n.count)):(n.count?String(n.count):''),kind:n.kind,status:n.status};

/* ---------- geometry helpers ---------- */
function simplify(pts){
  var o=[];pts.forEach(function(p){var l=o[o.length-1];if(!l||Math.abs(l[0]-p[0])>.5||Math.abs(l[1]-p[1])>.5)o.push([p[0],p[1]])});
  var r=[o[0]];for(var i=1;i<o.length-1;i++){var a=r[r.length-1],b=o[i],c=o[i+1];var col=(Math.abs(a[0]-b[0])<.5&&Math.abs(b[0]-c[0])<.5)||(Math.abs(a[1]-b[1])<.5&&Math.abs(b[1]-c[1])<.5);if(!col)r.push(b)}if(o.length>1)r.push(o[o.length-1]);return r;
}
function roundPath(pts,rad){
  pts=simplify(pts);if(pts.length<2)return'';
  var d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for(var i=1;i<pts.length-1;i++){var a=pts[i-1],b=pts[i],c=pts[i+1];
    var l1=Math.hypot(b[0]-a[0],b[1]-a[1]),l2=Math.hypot(c[0]-b[0],c[1]-b[1]);var r=Math.min(rad,l1/2,l2/2);
    var p1=[b[0]+(a[0]-b[0])*r/l1,b[1]+(a[1]-b[1])*r/l1],p2=[b[0]+(c[0]-b[0])*r/l2,b[1]+(c[1]-b[1])*r/l2];
    d+=' L'+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+' Q'+b[0].toFixed(1)+' '+b[1].toFixed(1)+' '+p2[0].toFixed(1)+' '+p2[1].toFixed(1);}
  var e=pts[pts.length-1];return d+' L'+e[0].toFixed(1)+' '+e[1].toFixed(1);
}
function finalize(sc){
  var x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  sc.cards.concat(sc.bands,sc.headers).forEach(function(r){x0=Math.min(x0,r.x);y0=Math.min(y0,r.y);x1=Math.max(x1,r.x+r.w);y1=Math.max(y1,r.y+r.h)});
  if(!isFinite(x0)){x0=y0=0;x1=y1=100}
  var dx=-x0,dy=-y0;
  sc.cards.concat(sc.bands,sc.headers,sc.cells).forEach(function(r){r.x+=dx;r.y+=dy});
  sc.paths.forEach(function(p){p.pts=p.pts.map(function(q){return[q[0]+dx,q[1]+dy]});p.d=roundPath(p.pts,9)});
  sc.w=x1-x0;sc.h=y1-y0;return sc;
}

/* ---------- hierarchy layout ---------- */
var CW=236,HG=26,VG=60,SI=20,SG=12;
function axisLabel(rid){
  var d=descendants(rid).map(function(i){return byId.get(i)}),cn=d.filter(function(n){return n.country==='CN'}).length;
  return cn>d.length/2?{label:'Execução e R&D',sub:'China',tone:'cn',flag:'CN'}:{label:'Negócio e produto',sub:'Brasil',tone:'br',flag:'BR'};
}
function layoutTree(rootIds){
  var CH=S.settings.showScope?122:92,memo=new Map(),sc={cards:[],paths:[],bands:[],headers:[],cells:[]};
  function vk(id){var n=byId.get(id);return n.collapsed?[]:kids(id)}
  function size(id){
    if(memo.has(id))return memo.get(id);
    var ch=vk(id),leaves=ch.filter(function(c){return!vk(c).length}),br=ch.filter(function(c){return vk(c).length}),u=[];
    if(leaves.length>=5){u.push({t:'s',ids:leaves,w:CW+SI,h:leaves.length*CH+(leaves.length-1)*SG});br.forEach(function(b){var s=size(b);u.push({t:'n',id:b,w:s.w,h:s.h})})}
    else ch.forEach(function(c){var s=size(c);u.push({t:'n',id:c,w:s.w,h:s.h})});
    var r;if(!u.length)r={w:CW,h:CH,u:u};else{var rw=u.reduce(function(a,x){return a+x.w},0)+HG*(u.length-1);r={w:Math.max(CW,rw),h:CH+VG+Math.max.apply(null,u.map(function(x){return x.h})),u:u,rw:rw}}
    memo.set(id,r);return r;
  }
  function place(id,x,y){
    var s=size(id),cx0=x+(s.w-CW)/2;sc.cards.push({id:id,x:cx0,y:y,w:CW,h:CH,variant:'full'});
    if(!s.u.length)return;
    var pcx=cx0+CW/2,my=y+CH+VG/2,cy=y+CH+VG,rx=x+(s.w-s.rw)/2;
    s.u.forEach(function(u){
      if(u.t==='s'){var spx=rx+7;u.ids.forEach(function(l,i){var ly=cy+i*(CH+SG);sc.cards.push({id:l,x:rx+SI,y:ly,w:CW,h:CH,variant:'full'});sc.paths.push({key:'r:'+l,from:id,to:l,kind:'solid',pts:[[pcx,y+CH],[pcx,my],[spx,my],[spx,ly+CH/2],[rx+SI,ly+CH/2]]})})}
      else{place(u.id,rx,cy);var ccx=rx+(u.w-CW)/2+CW/2;sc.paths.push({key:'r:'+u.id,from:id,to:u.id,kind:'solid',pts:[[pcx,y+CH],[pcx,my],[ccx,my],[ccx,cy]]})}
      rx+=u.w+HG;
    });
  }
  var x=0;
  rootIds.forEach(function(r){var s=size(r);place(r,x,0);if(rootIds.length>1||kids(r).length){var ax=axisLabel(r);sc.bands.push({key:'ax:'+r,x:x-32,y:-58,w:s.w+64,h:s.h+90,label:ax.label,sub:ax.sub,tone:ax.tone,flag:ax.flag})}x+=s.w+150});
  return finalize(sc);
}

/* ---------- tracks layout ---------- */
function layoutTracks(){
  var CH=S.settings.showScope?112:84,COLW=244,CG=12,LW=150,PAD=14,MINI=26,BG=18;
  var sc={cards:[],paths:[],bands:[],headers:[],cells:[]};
  var list=S.nodes.filter(function(n){return n.kind!=='bu'}).sort(function(a,b){return order.get(a.id)-order.get(b.id)});
  var cols=TRACKS.slice();
  if(list.some(function(n){return n.parent&&trackList(n)[0]==='all'})||list.some(function(n){return!n.parent&&trackList(n)[0]==='all'}))cols.push(ALLCOL);
  var ci={};cols.forEach(function(c,i){ci[c.id]=i});
  var colX=function(i){return LW+i*(COLW+CG)};
  var totalW=colX(cols.length)-CG;
  cols.forEach(function(c,i){sc.headers.push({key:'h:'+c.id,x:colX(i),y:0,w:COLW,h:54,title:c.name,sub:c.sub})});
  var bands=[{id:'lead',label:'Liderança',sub:'',tone:'lead',test:function(n){return!n.parent}},
             {id:'BR',label:'Brasil',sub:'Negócio, produto e especificação',tone:'br',flag:'BR',test:function(n){return n.parent&&n.country!=='CN'}},
             {id:'CN',label:'China',sub:'Execução, backlog e R&D',tone:'cn',flag:'CN',test:function(n){return n.parent&&n.country==='CN'}}];
  var y=70;
  bands.forEach(function(b){
    var items=list.filter(b.test);if(!items.length)return;
    var top=y,inner=top+PAD+(b.id==='lead'?0:MINI),colY=cols.map(function(){return inner});
    if(b.id!=='lead')cols.forEach(function(c,i){sc.headers.push({key:'m:'+b.id+':'+c.id,x:colX(i)+8,y:top+8,w:COLW-16,h:MINI-4,title:c.name,cls:'mini'})});
    items.forEach(function(n){
      var idx=trackList(n).map(function(t){return ci[t]}).filter(function(v){return v!=null});if(!idx.length)idx=[cols.length-1];
      var a=Math.min.apply(null,idx),z=Math.max.apply(null,idx),yy=0;for(var i=a;i<=z;i++)yy=Math.max(yy,colY[i]);
      sc.cards.push({id:n.id,x:colX(a)+8,y:yy,w:(z-a+1)*COLW+(z-a)*CG-16,h:CH,variant:'compact'});
      for(var j=a;j<=z;j++)colY[j]=yy+CH+10;
    });
    var bottom=Math.max.apply(null,colY)+PAD-10;
    sc.bands.push({key:'tb:'+b.id,x:0,y:top,w:totalW+8,h:bottom-top,label:b.label,sub:b.sub,tone:b.tone,flag:b.flag,side:true});
    if(b.id!=='lead')cols.forEach(function(c,i){sc.cells.push({x:colX(i),y:top,w:COLW,h:bottom-top,col:c.id,band:b.id})});
    y=bottom+BG;
  });
  return finalize(sc);
}
function scene(){return S.settings.view==='tracks'?layoutTracks():layoutTree(kids(null))}

/* ---------- pan / zoom ---------- */
var V={x:0,y:0,k:1};

function fit(ease){var r=stage.getBoundingClientRect(),pad=70;var k=Math.min((r.width-pad)/SC.w,(r.height-pad-40)/SC.h,1.05);k=Math.max(k,.08);V.k=k;V.x=(r.width-SC.w*k)/2;V.y=Math.max(46,(r.height-SC.h*k)/2+10);applyView(ease)}
function zoomAt(f,cx,cy,ease){var r=stage.getBoundingClientRect();if(cx==null){cx=r.width/2;cy=r.height/2}var nk=Math.min(2.5,Math.max(.08,V.k*f));V.x=cx-(cx-V.x)*nk/V.k;V.y=cy-(cy-V.y)*nk/V.k;V.k=nk;applyView(ease)}

function unb64(s){var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
function deriveKey(pass,salt,iter){return crypto.subtle.importKey('raw',new TextEncoder().encode(pass.normalize('NFC')),'PBKDF2',false,['deriveKey']).then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])})}
function encryptData(pass,obj){var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));return deriveKey(pass,salt,ITER).then(function(k){return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,new TextEncoder().encode(JSON.stringify(obj)))}).then(function(ct){return{v:1,kdf:'PBKDF2-SHA256',iter:ITER,salt:b64(salt),iv:b64(iv),ct:b64(ct)}})}
function decryptData(pass,enc){return deriveKey(pass,unb64(enc.salt),enc.iter).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(enc.iv)},k,unb64(enc.ct))}).then(function(pt){return JSON.parse(new TextDecoder().decode(pt))})}

function showLock(){
  var enc;try{enc=JSON.parse(document.getElementById('org-enc').textContent)}catch(e){enc=null}
  var l=document.createElement('div');l.className='lock';
  l.innerHTML='<form class="lock-card" autocomplete="off"><div class="k">PhizChat · BUs Brasil e China</div><h1>Organograma</h1><p>Conteúdo interno e protegido. Digite a frase-chave para abrir.</p>'
   +'<div class="fld"><label for="lockPass">Frase-chave</label><input type="password" id="lockPass" required autocomplete="current-password"></div>'
   +'<div class="err" id="lockErr"></div><button type="submit" class="btn primary" id="lockBtn">Abrir</button></form>';
  document.body.appendChild(l);var inp=l.querySelector('#lockPass'),btn=l.querySelector('#lockBtn'),er=l.querySelector('#lockErr');inp.focus();
  if(!enc){er.textContent='Este arquivo não tem dados cifrados.';btn.disabled=true;return}
  if(!(window.crypto&&crypto.subtle)){er.textContent='Abra esta página por https para usar a frase-chave.';btn.disabled=true;return}
  l.querySelector('form').addEventListener('submit',function(e){e.preventDefault();var p=inp.value;if(!p)return;btn.disabled=true;btn.textContent='Abrindo…';er.textContent='';
    decryptData(p,enc).then(function(d){PASS=p;l.classList.add('open');setTimeout(function(){l.remove()},400);boot(d)})
     .catch(function(){btn.disabled=false;btn.textContent='Abrir';er.textContent='Frase-chave incorreta.';inp.select()})});
}
if(MODE==='web'&&document.getElementById('org-enc'))showLock();
else{var D;try{D=JSON.parse(document.getElementById('org-data').textContent)}catch(e){D={nodes:[],settings:{}}}boot(D)}
})();
</script>
